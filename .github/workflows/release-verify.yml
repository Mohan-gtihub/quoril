name: Release Verify

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    env:
      QUORIL_RELEASE_BUILD: "true"
      # CI has no iCloud sync, so build in-tree as the verify steps expect.
      # Locally this defaults outside ~/Documents — see scripts/release-mac.mjs.
      QUORIL_RELEASE_OUT: release
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:mac
      # Both architectures are built, so both must be verified — checking only
      # arm64 would stay green while a broken x64 build shipped to Intel Macs.
      # electron-builder names the x64 output dir "mac", arm64 "mac-arm64".
      - name: Verify signature and notarization (arm64 + x64)
        run: |
          for app in release/mac-arm64/Quoril.app release/mac/Quoril.app; do
            echo "== $app"
            test -d "$app" || { echo "missing: $app"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
      # The update feed must offer something to Intel Macs. electron-updater
      # selects by the "arm64" substring, so an entry without it has to exist.
      - name: Verify the update feed covers both architectures
        run: |
          test -f release/latest-mac.yml || { echo "no latest-mac.yml"; exit 1; }
          grep -q 'arm64.*\.zip' release/latest-mac.yml || { echo "no arm64 zip in feed"; exit 1; }
          grep -E 'url: .*\.zip' release/latest-mac.yml | grep -qv arm64 \
            || { echo "no x64 zip in feed — Intel Macs would get no update"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: quoril-macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  windows:
    runs-on: windows-2022
    env:
      QUORIL_RELEASE_BUILD: "true"
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:win
      - shell: pwsh
        run: |
          $installer = Get-ChildItem "release/Quoril-Setup-*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not generated" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed: $($signature.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: quoril-windows-x64
          path: release/*.exe
